services:
  traefik:
    image: traefik
    container_name: "traefik"
    command:
      # Enable ping
      - --ping=true
      - --ping.entryPoint=web
      - --api.insecure=true
      - --providers.docker=true
      - --entryPoints.web.address=:80
      - --entryPoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --providers.docker.exposedbydefault=false
      - --entrypoints.websecure.http.tls=true
      - --certificatesresolvers.certificate.acme.dnschallenge=true
      - --certificatesresolvers.certificate.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.certificate.acme.dnschallenge.delaybeforecheck=10
      - --certificatesresolvers.certificate.acme.caserver=https://acme-v02.api.letsencrypt.org/directory
      - --certificatesresolvers.certificate.acme.storage=/acme/acme.json
      # Teamspeak specific:
      - --entryPoints.teamspeak-voice.address=:9987/udp
      - --entryPoints.teamspeak-query.address=:10080
      - --entryPoints.teamspeak-data.address=:30033
      # Enshrouded UDP
      - --entryPoints.enshrouded-game.address=:15636/udp
      - --entryPoints.enshrouded-query.address=:15637/udp

    ports:
      - 80:80
      - 443:443
      #- 8080:8080
      # Teamspeak ports
      - 9987:9987/udp
      - 10080:10080/tcp
      - 30033:30033/tcp
      # Enshrouded UDP
      - 15636:15636/udp
      - 15637:15637/udp
      # Vintage Story port
      #- 42420:42420
      # Enshrouded Ports
      
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../container/traefik/acme.json:/acme/acme.json
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    user: 969:970